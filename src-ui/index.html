<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <link rel="stylesheet" href="styles.css" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Tauri Sudoku App</title>
        <script type="module" src="/main.js" defer></script>
    </head>

    <body>
        <main class="container">
            <h1 style="text-align: center;">Sudoku Puzzle</h1>
            <div class="sudoku-grid" id="sudokuGrid"></div>
            <p id="bql-msg">This is the default text...</p>

            <script>
                // Generate the Sudoku grid
                const grid = document.getElementById('sudokuGrid');
                for (let i = 0; i < 81; i++) {
                    const cell = document.createElement('div');
                    cell.classList.add('cell');
                    cell.setAttribute('data-index', i);
                    grid.appendChild(cell);
                }

                const bqlMsg = document.getElementById('bql-msg');

                let selectedCell = null;

                // Add click event listener to highlight the selected cell
                grid.addEventListener('click', (e) => {
                    if (e.target.classList.contains('cell')) {
                        if (selectedCell) {
                            selectedCell.classList.remove('selected');
                        }
                        selectedCell = e.target;
                        selectedCell.classList.add('selected');
                    }
                });

                // Add keyboard event listener to set values in the selected cell
                document.addEventListener('keydown', (e) => {
                  const dataIndex = parseInt(selectedCell.getAttribute('data-index'));
                    if (selectedCell && e.key >= '1' && e.key <= '9') {
                        bqlMsg.textContent = `Key pressed: ${e.key}, Cell number: ${dataIndex}`;
                        bqlTest();
                        selectedCell.textContent = e.key;
                    } else if (selectedCell &&
                               ((e.key === 'Tab') ||
                                (e.key === 'ArrowRight') ||
                                (e.key === 'ArrowLeft') ||
                                (e.key === 'ArrowUp') ||
                                (e.key === 'ArrowDown'))) {
                        let nextIndex;
                        if (e.key === 'ArrowLeft') {
                            nextIndex = (dataIndex - 1 + 81) % 81;
                        } else if (e.key === 'Tab' || e.key === 'ArrowRight') {
                            nextIndex = (dataIndex + 1) % 81;
                        } else if (e.key === 'ArrowDown') {
                            nextIndex = (dataIndex + 9) % 81;
                        } else if (e.key === 'ArrowUp') {
                            nextIndex = (dataIndex - 9 + 81) % 81;
                        }
                        const nextCell = document.querySelector(`.cell[data-index="${nextIndex}"]`);
                        if (nextCell) {
                            selectedCell.classList.remove('selected');
                            selectedCell = nextCell;
                            selectedCell.classList.add('selected');
                        }
                    }
                });
            </script>
        </main>
    </body>
</html>
